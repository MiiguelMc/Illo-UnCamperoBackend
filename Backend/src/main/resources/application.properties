spring.application.name=Backend
server.port=8081

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}

# Cloudinary (signed upload)
# En Render: Environment > Add Environment Variable
# Consigue los valores en: https://console.cloudinary.com → Dashboard
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Brevo SMTP (email transaccional)
# Variables de entorno necesarias: BREVO_EMAIL y BREVO_SMTP_KEY
# En Render: Environment > Add Environment Variable
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_EMAIL:noreply@example.com}
spring.mail.password=${BREVO_SMTP_KEY:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
