spring.application.name=Backend
server.port=8081

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}

# Cloudinary (signed upload)
# En Render: Environment > Add Environment Variable
# Consigue los valores en: https://console.cloudinary.com → Dashboard
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:sin-configurar}
cloudinary.api-key=${CLOUDINARY_API_KEY:sin-configurar}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:sin-configurar}

# Gmail SMTP (email transaccional)
# Variables de entorno en Render: GMAIL_EMAIL y GMAIL_APP_PASSWORD
# Cómo obtener la contraseña de aplicación:
# myaccount.google.com → Seguridad → Verificación en 2 pasos → Contraseñas de aplicaciones
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_EMAIL:noreply@example.com}
spring.mail.password=${GMAIL_APP_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
