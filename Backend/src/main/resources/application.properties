spring.application.name=Backend
server.port=8081

# Stripe - La clave se lee de la variable de entorno STRIPE_SECRET_KEY
# Para local: ponla en la configuracion de ejecucion de IntelliJ (Run > Edit Configurations > Environment Variables)
# Para Render: ponla en el panel de tu servicio en Environment > Add Environment Variable
stripe.secret-key=${STRIPE_SECRET_KEY}
