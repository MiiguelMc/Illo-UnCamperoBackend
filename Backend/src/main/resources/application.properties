spring.application.name=Backend
server.port=${PORT:8081}

# ---------------------------------------------------------------
# Base de datos: Supabase Postgres (conexion directa / pooler)
# SUPABASE_DB_URL ejemplo:
#   jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require
# ---------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# El esquema lo gestiona supabase/schema.sql; Hibernate no toca el DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Pool acotado: el pooler gratuito de Supabase limita las conexiones.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Supabase Auth: validacion de token via /auth/v1/user + Admin API
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

# Web Push (VAPID)
vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT:mailto:admin@illouncampero.com}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:sin-configurar}
cloudinary.api-key=${CLOUDINARY_API_KEY:sin-configurar}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:sin-configurar}
